name: Test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: mvn -B -s settings.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/
  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh scripts/package-macos.sh
      - name: Verify installation without system Java
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 1 -type d -name 'dbx-*' | head -1)
          DBX_INSTALL_DIR="$RUNNER_TEMP/dbx-install" DBX_BIN_DIR="$RUNNER_TEMP/dbx-bin" sh "$bundle/install.sh"
          PATH=/usr/bin:/bin "$RUNNER_TEMP/dbx-bin/dbx" capabilities
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256
